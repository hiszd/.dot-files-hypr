# █▀▀ ▀▄▀ █▀▀ █▀▀
# ██▄ █░█ ██▄ █▄▄
exec-once = wl-clipboard-history -t
exec-once = ~/.config/hypr/xdg-portal-hyprland
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
exec-once = wlsunset -S 9:00 -s 19:30
exec = swaybg -m fill -i ~/.wallpapers/current.png
# exec = killall launch-waybar.sh ; /bin/bash -c '$HOME/.config/hypr/launch-waybar.sh'
exec-once = eww daemon
# exec-once = eww open bar0
# exec-once = eww open bar1

env = TERMINAL,ghostty

env = _JAVA_AWT_WM_NONREPARENTING,1
env = XCURSOR_SIZE,24

# comment out next block if not using Intel for hardware acceleration
env = LIBVA_DRIVER_NAME,iHD

env = XDG_SESSION_TYPE,wayland
env = WLR_NO_HARDWARE_CURSORS,1
env = MOZ_ENABLE_WAYLAND,1
env = NVD_BACKEND,direct
env = GTK_USE_PORTAL,0

# comment out next block if not using Nvidia for hardware acceleration
# env=LIBVA_DRIVER_NAME,nvidia
# env=GBM_BACKEND,nvidia-drm
# env=__GLX_VENDOR_LIBRARY_NAME,nvidia

# █▀▄▀█ █▀█ █▄░█ █ ▀█▀ █▀█ █▀█
# █░▀░█ █▄█ █░▀█ █ ░█░ █▄█ █▀▄

monitor=,preferred,auto,1

exec = killall hyprswitch ; ~/.local/bin/hyprswitch | tee ~/.config/hyprswitch/hyprswitch.log

# █ █▄░█ █▀█ █░█ ▀█▀
# █ █░▀█ █▀▀ █▄█ ░█░
input {
  kb_layout = us
  follow_mouse = 1
  sensitivity = 0 # -1.0 - 1.0, 0 means no modification.
}

device {
  name = at-translated-set-2-keyboard
  kb_options = caps:ctrl_modifier
}

# █▀▀ █▀▀ █▄░█ █▀▀ █▀█ ▄▀█ █░░
# █▄█ ██▄ █░▀█ ██▄ █▀▄ █▀█ █▄▄
general {
  gaps_in=5
  gaps_out=5
  border_size=2
  no_border_on_floating = true
  layout = dwindle
  resize_on_border = true

  # Colors For Themes
  col.inactive_border = rgba(004e7522)
  col.active_border = rgba(004e7566)
}

group {
  insert_after_current = true
  col.border_active = rgba(ffffff66)
  col.border_inactive = rgba(ffffff22)
  groupbar {
    gradients = true
    font_size = 10
    col.active = rgba(ffffff88)
    col.inactive = rgba(ffffff44)
  }
}

# █▀▄▀█ █ █▀ █▀▀
# █░▀░█ █ ▄█ █▄▄
misc {
  disable_hyprland_logo = true
  disable_splash_rendering = true
  mouse_move_enables_dpms = true
  enable_swallow = true
  swallow_regex = ^(wezterm)$
}

# █▀▄ █▀▀ █▀▀ █▀█ █▀█ ▄▀█ ▀█▀ █ █▀█ █▄░█
# █▄▀ ██▄ █▄▄ █▄█ █▀▄ █▀█ ░█░ █ █▄█ █░▀█

decoration {
  # █▀█ █▀█ █░█ █▄░█ █▀▄   █▀▀ █▀█ █▀█ █▄░█ █▀▀ █▀█
  # █▀▄ █▄█ █▄█ █░▀█ █▄▀   █▄▄ █▄█ █▀▄ █░▀█ ██▄ █▀▄
  rounding = 8
  # multisample_edges = true

  # █▀█ █▀█ ▄▀█ █▀▀ █ ▀█▀ █▄█
  # █▄█ █▀▀ █▀█ █▄▄ █ ░█░ ░█░
  active_opacity = 1.0
  inactive_opacity = 1.0

  # █▄▄ █░░ █░█ █▀█
  # █▄█ █▄▄ █▄█ █▀▄
  # blur = true
  # blur_size = 3
  # blur_passes = 3
  # blur_new_optimizations = true

  blurls = gtk-layer-shell
  # blurls = waybar
  blurls = lockscreen
}

# ▄▀█ █▄░█ █ █▀▄▀█ ▄▀█ ▀█▀ █ █▀█ █▄░█
# █▀█ █░▀█ █ █░▀░█ █▀█ ░█░ █ █▄█ █░▀█
animations {
    enabled = yes, please :)

    # Default animations, see https://wiki.hyprland.org/Configuring/Animations/ for more

    bezier = easeOutQuint,0.23,1,0.32,1
    bezier = easeInOutCubic,0.65,0.05,0.36,1
    bezier = linear,0,0,1,1
    bezier = almostLinear,0.5,0.5,0.75,1.0
    bezier = quick,0.15,0,0.1,1

    animation = global, 1, 10, default
    animation = border, 1, 5.39, easeOutQuint
    animation = windows, 1, 4.79, easeOutQuint
    animation = windowsIn, 1, 4.1, easeOutQuint, popin 87%
    animation = windowsOut, 1, 1.49, linear, popin 87%
    animation = fadeIn, 1, 1.73, almostLinear
    animation = fadeOut, 1, 1.46, almostLinear
    animation = fade, 1, 3.03, quick
    animation = layers, 1, 3.81, easeOutQuint
    animation = layersIn, 1, 4, easeOutQuint, fade
    animation = layersOut, 1, 1.5, linear, fade
    animation = fadeLayersIn, 1, 1.79, almostLinear
    animation = fadeLayersOut, 1, 1.39, almostLinear
    animation = workspaces, 1, 1.94, almostLinear, fade
    animation = workspacesIn, 1, 1.21, almostLinear, fade
    animation = workspacesOut, 1, 1.94, almostLinear, fade
}

gestures {
  workspace_swipe = true
  workspace_swipe_fingers = 3
}

# █░░ ▄▀█ █▄█ █▀█ █░█ ▀█▀ █▀
# █▄▄ █▀█ ░█░ █▄█ █▄█ ░█░ ▄█

dwindle {
  pseudotile = true # master switch for pseudotiling. Enabling is bound to mainMod + P in the keybinds section below
  preserve_split = true # you probably want this
}

# █░█░█ █ █▄░█ █▀▄ █▀█ █░█░█   █▀█ █░█ █░░ █▀▀ █▀
# ▀▄▀▄▀ █ █░▀█ █▄▀ █▄█ ▀▄▀▄▀   █▀▄ █▄█ █▄▄ ██▄ ▄█
windowrule = float, class:file_progress
windowrule = float, class:confirm
windowrule = float, class:dialog
windowrule = float, class:download
windowrule = float, class:notification
windowrule = float, class:error
windowrule = float, class:splash
windowrule = float, class:confirmreset
windowrule = float, title:Open File
windowrule = float, title:branchdialog
windowrule = float, class:Lxappearance
# windowrule = float, Rofi
# windowrule = animation none,Rofi
windowrule = float, class:viewnior
windowrule = float, class:feh
windowrule = float, class:pavucontrol-qt
windowrule = float, class:pavucontrol
windowrule = float, class:file-roller
windowrule = fullscreen, class:wlogout
windowrule = float, title:wlogout
windowrule = fullscreen, title:wlogout
windowrule = idleinhibit focus, class:mpv
windowrule = idleinhibit fullscreen, class:firefox-devedition
windowrule = float, title:^(Media viewer)$
windowrule = float, title:^(Volume Control)$
windowrule = float, title:^(Picture-in-Picture)$
windowrule = size 800 600, title:^(Volume Control)$
windowrule = move 75 44%, title:^(Volume Control)$

# █▄▀ █▀▀ █▄█ █▄▄ █ █▄░█ █▀▄
# █░█ ██▄ ░█░ █▄█ █ █░▀█ █▄▀

bind = SUPER, B, exec, microsoft-edge-dev

bind = ALT,M,submap,move # will switch to a submap called move

submap=move # will start a submap called "move"

binde= ,right,movefocus,r
binde= ,left,movefocus,l
binde= ,up,movefocus,u
binde= ,down,movefocus,d

binde= SHIFT,right,movewindow,r
binde= SHIFT,left,movewindow,l
binde= SHIFT,up,movewindow,u
binde= SHIFT,down,movewindow,d

binde= SHIFT,1,workspace,1
binde= SHIFT,2,workspace,2
binde= SHIFT,3,workspace,3
binde= SHIFT,4,workspace,4
binde= SHIFT,5,workspace,5
binde= SHIFT,6,workspace,6
binde= SHIFT,7,workspace,7
binde= SHIFT,8,workspace,8
binde= SHIFT,9,workspace,9
binde= SHIFT,0,workspace,10
binde= SHIFT,minus,workspace,special
binde= SHIFT,equal,workspace,name:Unused
binde= ,Q,killactive

binde= ,1,movetoworkspacesilent,1
binde= ,2,movetoworkspacesilent,2
binde= ,3,movetoworkspacesilent,3
binde= ,4,movetoworkspacesilent,4
binde= ,5,movetoworkspacesilent,5
binde= ,6,movetoworkspacesilent,6
binde= ,7,movetoworkspacesilent,7
binde= ,8,movetoworkspacesilent,8
binde= ,9,movetoworkspacesilent,9
binde= ,0,movetoworkspacesilent,10
binde= ,minus,movetoworkspacesilent,special
binde= ,equal,movetoworkspacesilent,name:Unused 

binde= ,g,togglegroup
binde= ,tab,changegroupactive
binde= ALT,left,moveintogroup,l
binde= ALT,right,moveintogroup,r
binde= ALT,up,moveintogroup,u
binde= ALT,down,moveintogroup,d
binde= ALT,g,moveoutofgroup

bind = SUPER CTRL,c,centerwindow

# bind=CTRL,left,move,-10%,0
# bind=CTRL,right,move,10%,0
# bind=CTRL,up,move,0,10%
# bind=CTRL,down,move,0,-10%

bind = ,escape,submap,reset # use reset to go back to the global submap

submap=reset # will reset the submap, meaning end the current one and return to the global one.

# keybinds further down will be global again...

# █▀▄▀█ █░█ █░░ ▀█▀ █ █▀▄▀█ █▀▀ █▀▄ █ ▄▀█
# █░▀░█ █▄█ █▄▄ ░█░ █ █░▀░█ ██▄ █▄▀ █ █▀█
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, brightnessctl s 10%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl s 10%-

# Requires playerctl
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous

# █▀ █▀▀ █▀█ █▀▀ █▀▀ █▄░█ █▀ █░█ █▀█ ▀█▀
# ▄█ █▄▄ █▀▄ ██▄ ██▄ █░▀█ ▄█ █▀█ █▄█ ░█░
$screenshotarea = hyprctl keyword animation "fadeOut,0,0,default"; grimblast --notify copysave area; hyprctl keyword animation "fadeOut,1,4,default"
bind = SUPER SHIFT, S, exec, $screenshotarea
bind = , Print, exec, grimblast --notify --cursor copysave output
bind = ALT, Print, exec, grimblast --notify --cursor copysave screen

# █▀▄▀█ █ █▀ █▀▀
# █░▀░█ █ ▄█ █▄▄
bind = SUPER SHIFT, X, exec, hyprpicker -a -n
bind = CTRL ALT, L, exec, gtklock
bind = SUPER, Return, exec, ghostty
bind = SUPER, X, exec, kitty
bind = SUPER, E, exec, thunar
bind = SUPER, R, exec, killall wofi || wofi --show drun --style ~/.config/wofi/style.css -D key_expand=Tab --allow-images

# █░█░█ █ █▄░█ █▀▄ █▀█ █░█░█   █▀▄▀█ ▄▀█ █▄░█ ▄▀█ █▀▀ █▀▄▀█ █▀▀ █▄░█ ▀█▀
